name: Enterprise Data Platform & IaC CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-software-engineering-and-quality:
    name: Test Software Engineering Core & Data Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate Enterprise Mock Datasets
        run: |
          python scripts/ingestion/generate_enterprise_mock_data.py
          python scripts/utils/generate_enriched_datasets.py

      - name: Execute Galaxy Schema Data Pipeline
        run: |
          python scripts/pipeline_runner.py

      - name: Run Pytest Suite (Data Quality & Software Engineering Core)
        run: |
          export PYTHONPATH=.:src
          pytest -v tests/

      - name: Validate Power BI Files Unchanged
        run: |
          git status --porcelain powerbi/
          if [ -n "$(git status --porcelain powerbi/)" ]; then
            echo "ERROR: Power BI files were modified!"
            exit 1
          fi

  validate-docker:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Container
        run: |
          docker build -t enterprise-hr-analytics:ci .

  validate-terraform-iac:
    name: Validate Terraform Infrastructure as Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init & Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate
