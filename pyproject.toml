[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-hr-analytics"
version = "2.0.0"
description = "Enterprise Human Capital, Software House & Operational Diagnostics Data Platform"
readme = "README.md"
authors = [{ name = "Sohila Khaled Abbas", email = "sohilakhaled811@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pyodbc>=5.1.0",
    "SQLAlchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[project.scripts]
enterprise-hr = "enterprise_hr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 120
target-version = ['py311', 'py312', 'py314']
include = '\.pyi?$'
